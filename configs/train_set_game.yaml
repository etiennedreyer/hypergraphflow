model: htrm
dataset: set_game

optimizer: adam
learning_rate: 1.0e-3
num_epochs: 200
limit_train_batches: 64
limit_val_batches: 8
num_workers: &W 1
nray: 8
seed: 123456
accelerator: 'cuda'
devices: [0]

dl_train:
  total_size: 0
  batch_size: 512
  num_workers: *W
  shuffle: false

dl_val:
  total_size: 0
  batch_size: 512
  num_workers: *W
  shuffle: false

dl_test:
  total_size: 0
  batch_size: 512
  num_workers: *W
  shuffle: false