name: htrm
share_weights: false

### dimensions
num_node_features: &F 4
num_edges: &K 8
hidden_dim: &H 36

### attention
timestep_embedding: false
time_dim: &T 8
freq_dim: 64

node_embedder:
    input_dim: *F # this gets overwritten in hhrm.py
    layers: []
    output_dim: *H
    activation: relu

node_CA_L:
    model_dim: *H
    c_dim: *T
    num_heads: 3
    num_layers: 2
    gated: false
    scaling: true
    activation: silu
    ffn_factor: 2

edge_CA_H:
    model_dim: *H
    c_dim: *T
    num_heads: 3
    num_layers: 2
    gated: false
    scaling: true
    activation: silu
    ffn_factor: 2

indicator_predictor:
    input_dim: *H
    layers: [64, 32]
    output_dim: 1
    activation: relu

hrm:
    iters_L: 2
    iters_H: 2
    segments: 3
    use_draft: false