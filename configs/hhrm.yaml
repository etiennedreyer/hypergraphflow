name: hhrm

### dimensions
num_node_features: &F 3
num_edges: &K 42
hidden_dim: &H 36

### attention
timestep_embedding: true
time_dim: &T 8
freq_dim: 64

node_embedder:
    input_dim: *F # this gets overwritten in hhrm.py
    layers: []
    output_dim: *H
    activation: relu

node_CA_L:
    embed_dim: *H
    context_dim: *T
    mha_config:
        num_heads: 3
        num_layers: 4
        attn_type: flash 
    gated: false
    scaling: true
    activation: silu
    ffn_factor: 2

edge_CA_H:
    embed_dim: *H
    context_dim: *T
    mha_config:
        num_heads: 3
        num_layers: 4
        attn_type: flash
    gated: false
    scaling: true
    dense_config:
        activation: silu
        ffn_factor: 2

indicator_predictor:
    input_dim: *H
    layers: [64, 32]
    output_dim: 1
    activation: relu

hrm:
    iters_L: 2
    iters_H: 2
    segments: 8
    use_draft: false